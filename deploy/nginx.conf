# 公网入口：nginx 终止 TLS，把请求转给本机 127.0.0.1:8080。
#
# 只有这样才能把真实客户端 IP 传给网关：网关默认只信任回环网段的
# X-Forwarded-For，所以必须由 nginx 覆写该头（而不是追加）。
#
# 部署要点：
#   1. 证书放到 /etc/letsencrypt/live/<domain>/（见 deploy.sh 的 certbot 步骤）
 #   2. limit_req 是网关外层的第一道闸，与网关内部的令牌桶互补
#   3. 不要把 127.0.0.1:8080 直接暴露到公网

limit_req_zone $binary_remote_addr zone=lock_api:10m rate=200r/m;

upstream storage_lock_cloud {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name locks.example.com;
    # 强制 HTTPS，避免明文传输 secret。
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name locks.example.com;

    ssl_certificate     /etc/letsencrypt/live/locks.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/locks.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    client_max_body_size 16k;
    client_body_timeout 10s;

    location / {
        limit_req zone=lock_api burst=60 nodelay;
        limit_req_status 429;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Connection        "";
        # 覆写而不是追加：防止客户端自己塞一个伪造的 XFF 进去。
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP         $remote_addr;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering off;

        proxy_pass http://storage_lock_cloud;
    }

    # 健康检查不打限流，便于监控高频探测。
    location = /health {
        access_log off;
        proxy_set_header Host $host;
        proxy_pass http://storage_lock_cloud;
    }
}
